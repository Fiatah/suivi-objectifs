<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker - Jalons & Édition d'Objectifs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

  <!-- MODAL AUTHENTIFICATION -->
  <div id="auth-container" class="max-w-md mx-auto mt-20 bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl space-y-4">
    <h2 id="auth-title" class="text-xl font-bold text-center text-white">Connexion</h2>
    
    <form onsubmit="handleAuthSubmit(event)" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Email</label>
        <input type="email" id="auth-email" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Mot de passe</label>
        <input type="password" id="auth-password" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white">
      </div>
      <p id="auth-error" class="text-xs text-red-400 hidden"></p>
      <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-xs transition">Se Connecter</button>
    </form>

    <div class="text-center pt-2">
      <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs text-blue-400 hover:underline">
        Pas encore de compte ? S'inscrire
      </button>
    </div>
  </div>

  <!-- APPLICATION PRINCIPALE (Masquée au départ) -->
  <div id="app-container" class="hidden max-w-6xl mx-auto space-y-6">
    
    <!-- En-tête -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-800 pb-4 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-white">Tableau de Bord & Routine</h1>
        <p class="text-xs text-gray-400" id="user-email-label">Bienvenue</p>
      </div>
      
      <div class="flex flex-wrap items-center gap-3">
        <!-- Sélecteur d'historique -->
        <div class="flex items-center space-x-1 bg-gray-800 p-1 rounded-lg border border-gray-700">
          <span class="text-xs text-gray-400 pl-2">📅 Historique :</span>
          <input type="date" id="history-date-picker" onchange="onDateChange(this.value)" class="bg-gray-900 border border-gray-700 rounded text-xs px-2 py-1 text-white">
          <button onclick="resetToToday()" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-2 py-1 rounded">Aujourd'hui</button>
        </div>

        <button onclick="openWeightModal()" class="bg-purple-900/40 hover:bg-purple-800/60 border border-purple-700 text-purple-200 text-xs px-3 py-1.5 rounded transition">
          ⚙️ Coefficients
        </button>

        <div class="flex items-center bg-gray-800 p-1 rounded-lg border border-gray-700">
          <button id="btn-view-daily" onclick="setViewMode('daily')" class="px-3 py-1 rounded text-xs font-semibold bg-blue-600 text-white transition">
            📅 Vue Jour
          </button>
          <button id="btn-view-weekly" onclick="setViewMode('weekly')" class="px-3 py-1 rounded text-xs font-semibold text-gray-400 hover:text-white transition">
            📆 Vue Semaine
          </button>
        </div>

        <button onclick="handleSignOut()" class="bg-red-900/40 hover:bg-red-800/60 border border-red-700 text-red-200 text-xs px-3 py-1.5 rounded transition">
          Déconnexion
        </button>
      </div>
    </div>

    <!-- JAUGES CIRCULAIRES -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-gray-800/80 border border-gray-700 rounded-xl p-5 flex items-center justify-between shadow-lg">
        <div>
          <span id="label-mode-raw" class="text-[10px] font-bold text-blue-400 uppercase tracking-wider">Taux d'Effort - Jour</span>
          <h3 class="text-lg font-bold text-white mt-1">Completion Brute</h3>
          <p class="text-xs text-gray-400 mt-1" id="raw-pts-label">0 / 0 pts</p>
        </div>
        <div class="relative flex items-center justify-center">
          <svg class="w-24 h-24 transform -rotate-90">
            <circle cx="48" cy="48" r="38" stroke="currentColor" stroke-width="8" class="text-gray-700" fill="transparent" />
            <circle id="circle-raw-stroke" cx="48" cy="48" r="38" stroke="currentColor" stroke-width="8" class="text-blue-500 transition-all duration-500 ease-out" stroke-dasharray="238.76" stroke-dashoffset="238.76" stroke-linecap="round" fill="transparent" />
          </svg>
          <span id="circle-raw-text" class="absolute text-base font-extrabold text-white">0%</span>
        </div>
      </div>

      <div class="bg-gray-800/80 border border-gray-700 rounded-xl p-5 flex items-center justify-between shadow-lg">
        <div>
          <span id="label-mode-weighted" class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Taux d'Impact - Jour</span>
          <h3 class="text-lg font-bold text-white mt-1">Score Ajusté (Pondéré)</h3>
          <p class="text-xs text-gray-400 mt-1" id="weighted-pts-label">0 / 0 pts</p>
        </div>
        <div class="relative flex items-center justify-center">
          <svg class="w-24 h-24 transform -rotate-90">
            <circle cx="48" cy="48" r="38" stroke="currentColor" stroke-width="8" class="text-gray-700" fill="transparent" />
            <circle id="circle-weighted-stroke" cx="48" cy="48" r="38" stroke="currentColor" stroke-width="8" class="text-emerald-400 transition-all duration-500 ease-out" stroke-dasharray="238.76" stroke-dashoffset="238.76" stroke-linecap="round" fill="transparent" />
          </svg>
          <span id="circle-weighted-text" class="absolute text-base font-extrabold text-white">0%</span>
        </div>
      </div>
    </div>

    <!-- ONGLETS -->
    <div class="flex border-b border-gray-800 space-x-6">
      <button id="tab-btn-tasks" onclick="switchTab('tasks')" class="pb-3 text-sm font-semibold border-b-2 border-blue-500 text-blue-400">
        ✅ Tâches & Groupes
      </button>
      <button id="tab-btn-goals" onclick="switchTab('goals')" class="pb-3 text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-white">
        🎯 Objectifs
      </button>
    </div>

    <!-- TAB 1 : GROUPES & TÂCHES -->
    <div id="tab-content-tasks" class="space-y-6">
      <div id="groups-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      <div id="weekly-matrix-wrapper" class="hidden bg-gray-800 border border-gray-700 rounded-xl p-5 space-y-3">
        <h3 class="text-sm font-bold text-white">Récapitulatif Hebdomadaire Global</h3>
        <div id="weekly-matrix-container" class="overflow-x-auto"></div>
      </div>
    </div>

    <!-- TAB 2 : OBJECTIFS -->
    <div id="tab-content-goals" class="hidden space-y-6">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-lg font-bold text-white">Parcours d'Objectifs</h2>
          <p class="text-xs text-gray-400">Gérez vos sous-objectifs, vos tâches et éditez-les facilement.</p>
        </div>
        <button onclick="openCreateGoalModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1">
          <span>➕ Définir un Objectif</span>
        </button>
      </div>

      <div id="goals-list-container" class="space-y-5"></div>
    </div>

  </div>

  <!-- MODAL PRINCIPAL -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/75 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 border border-gray-700 rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-white"></h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white font-bold">&times;</button>
      </div>
      <div id="modal-content" class="text-sm text-gray-300"></div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script>
    let isSignUpMode = false;
    let currentViewMode = 'daily';
    let tempSubGoals = [];

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('history-date-picker').value = getLocalDateString();

      await initAuth((user) => {
        if (user) {
          document.getElementById('auth-container').classList.add('hidden');
          document.getElementById('app-container').classList.remove('hidden');
          document.getElementById('user-email-label').innerText = `Connecté en tant que : ${user.email}`;
          initApp();
        } else {
          document.getElementById('auth-container').classList.remove('hidden');
          document.getElementById('app-container').classList.add('hidden');
        }
      });
    });

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('auth-title').innerText = isSignUpMode ? "Créer un compte" : "Connexion";
      document.getElementById('auth-submit-btn').innerText = isSignUpMode ? "S'inscrire" : "Se Connecter";
      document.getElementById('auth-toggle-btn').innerText = isSignUpMode ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const errEl = document.getElementById('auth-error');
      errEl.classList.add('hidden');

      try {
        if (isSignUpMode) {
          await signUpUser(email, password);
          alert("Inscription réussie ! Vous pouvez maintenant vous connecter.");
          toggleAuthMode();
        } else {
          await signInUser(email, password);
        }
      } catch (err) {
        errEl.innerText = err.message || "Erreur d'authentification";
        errEl.classList.remove('hidden');
      }
    }

    async function handleSignOut() {
      await signOutUser();
    }

    function onDateChange(val) {
      if (val === getLocalDateString()) {
        selectedHistoryDate = null;
      } else {
        selectedHistoryDate = val || null;
      }
      renderUI();
    }

    function resetToToday() {
      const today = getLocalDateString();
      document.getElementById('history-date-picker').value = today;
      selectedHistoryDate = null;
      renderUI();
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('btn-view-daily').className = mode === 'daily' ? "px-3 py-1 rounded text-xs font-semibold bg-blue-600 text-white transition" : "px-3 py-1 rounded text-xs font-semibold text-gray-400 hover:text-white transition";
      document.getElementById('btn-view-weekly').className = mode === 'weekly' ? "px-3 py-1 rounded text-xs font-semibold bg-blue-600 text-white transition" : "px-3 py-1 rounded text-xs font-semibold text-gray-400 hover:text-white transition";
      document.getElementById('label-mode-raw').innerText = mode === 'daily' ? "Taux d'Effort - Jour" : "Taux d'Effort - Semaine";
      document.getElementById('label-mode-weighted').innerText = mode === 'daily' ? "Taux d'Impact - Jour" : "Taux d'Impact - Semaine";

      const weeklyWrapper = document.getElementById('weekly-matrix-wrapper');
      if (mode === 'weekly') weeklyWrapper.classList.remove('hidden');
      else weeklyWrapper.classList.add('hidden');

      renderUI();
    }

    function switchTab(tab) {
      document.getElementById('tab-btn-tasks').className = tab === 'tasks' ? "pb-3 text-sm font-semibold border-b-2 border-blue-500 text-blue-400" : "pb-3 text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-white";
      document.getElementById('tab-btn-goals').className = tab === 'goals' ? "pb-3 text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-white" : "pb-3 text-sm font-semibold border-b-2 border-blue-500 text-blue-400";
      document.getElementById('tab-content-tasks').className = tab === 'tasks' ? "space-y-6" : "hidden";
      document.getElementById('tab-content-goals').className = tab === 'goals' ? "space-y-6" : "hidden";

      renderUI();
    }

    function updateCircleProgress(strokeId, textId, pct) {
      const circle = document.getElementById(strokeId);
      const text = document.getElementById(textId);
      const circumference = 2 * Math.PI * 38;
      const offset = circumference - (pct / 100) * circumference;
      circle.style.strokeDashoffset = offset;
      text.innerText = `${pct}%`;
    }

    function renderUI() {
      const st = loadState();
      const today = getTodayString();
      const todayDayKey = getTodayDayKey();

      // Stats
      const scores = calculateGlobalScores(currentViewMode);
      updateCircleProgress('circle-raw-stroke', 'circle-raw-text', scores.raw.pct);
      document.getElementById('raw-pts-label').innerText = `${scores.raw.earned} / ${scores.raw.expected} pts d'effort`;
      updateCircleProgress('circle-weighted-stroke', 'circle-weighted-text', scores.weighted.pct);
      document.getElementById('weighted-pts-label').innerText = `${scores.weighted.earned} / ${scores.weighted.expected} pts d'impact`;

      // Groupes
      const groupsContainer = document.getElementById('groups-container');
      groupsContainer.innerHTML = '';

      st.groups.forEach(group => {
        const groupTasks = st.tasks.filter(t => {
          if (t.groupId !== group.id) return false;
          if (currentViewMode === 'daily') return !t.days || t.days.length === 0 || t.days.includes(todayDayKey);
          return true;
        });

        let tasksHtml = groupTasks.map(t => {
          const isDone = !!st.logs[today]?.[t.id]?.completed;
          let badgeColor = 'bg-blue-950 text-blue-300 border-blue-800';
          if (t.points === 20) badgeColor = 'bg-yellow-950 text-yellow-300 border-yellow-800';
          if (t.points === 30) badgeColor = 'bg-red-950 text-red-300 border-red-800';

          const daysBadges = t.days ? t.days.map(d => {
            const dayObj = DAYS_MAP.find(m => m.key === d);
            return dayObj ? `<span class="text-[9px] bg-gray-800 text-gray-300 px-1 rounded">${dayObj.label}</span>` : '';
          }).join('') : '';

          return `
            <div class="bg-gray-900/90 p-2.5 rounded-lg border border-gray-700/60 hover:border-gray-600 transition space-y-1.5 group">
              <div class="flex items-center justify-between">
                <label class="flex items-center space-x-2.5 cursor-pointer text-xs ${isDone ? 'line-through text-gray-500' : 'text-gray-200'}">
                  <input type="checkbox" ${isDone ? 'checked' : ''} onchange="onToggleTask('${t.id}')" class="rounded border-gray-700 bg-gray-800 text-blue-600">
                  <span>${t.title}</span>
                </label>
                <div class="flex items-center space-x-2">
                  <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border ${badgeColor}">+${t.points} pts</span>
                  <button onclick="onDeleteTask('${t.id}')" class="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-400 text-xs transition">&times;</button>
                </div>
              </div>
              <div class="flex space-x-1 pl-6">${daysBadges}</div>
            </div>
          `;
        }).join('');

        if (groupTasks.length === 0) {
          tasksHtml = `<p class="text-[11px] text-gray-500 italic py-2">${currentViewMode === 'daily' ? 'Aucune tâche programmée pour ce jour.' : 'Aucune tâche dans ce groupe.'}</p>`;
        }

        groupsContainer.innerHTML += `
          <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex flex-col justify-between space-y-3 shadow-sm">
            <div>
              <div class="flex items-center justify-between border-b border-gray-700/60 pb-2 mb-3">
                <div class="flex items-center space-x-2">
                  <span>${group.icon}</span>
                  <h3 class="font-bold text-white text-xs tracking-wide">${group.name}</h3>
                </div>
                <div class="flex items-center space-x-2">
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-purple-900/40 text-purple-300 border border-purple-700">Coeff. ×${group.weight || 1}</span>
                  <button onclick="onDeleteGroup('${group.id}')" title="Supprimer le groupe" class="text-gray-500 hover:text-red-400 text-xs transition">🗑️</button>
                </div>
              </div>
              <div class="space-y-2">${tasksHtml}</div>
            </div>

            <button onclick="openAddTaskModal('${group.id}', '${group.name}')" class="w-full mt-2 bg-gray-900/60 hover:bg-gray-700 border border-dashed border-gray-700 hover:border-gray-500 text-gray-400 hover:text-white py-1.5 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1">
              <span>➕ Ajouter une tâche</span>
            </button>
          </div>
        `;
      });

      groupsContainer.innerHTML += `
        <div onclick="openAddGroupModal()" class="bg-gray-800/40 hover:bg-gray-800 border-2 border-dashed border-gray-700 hover:border-blue-500 rounded-xl p-6 flex flex-col items-center justify-center cursor-pointer min-h-[180px] transition group">
          <div class="w-12 h-12 rounded-full bg-gray-900 group-hover:bg-blue-600/20 text-gray-400 group-hover:text-blue-400 flex items-center justify-center text-2xl font-bold transition mb-2">➕</div>
          <span class="text-xs font-bold text-gray-400 group-hover:text-white transition">Nouveau Groupe</span>
          <span class="text-[10px] text-gray-500 mt-1">Personnalisez vos catégories</span>
        </div>
      `;

      // Matrix Semaine
      if (currentViewMode === 'weekly') {
        const weekDates = getCurrentWeekDates();
        const weeklyContainer = document.getElementById('weekly-matrix-container');

        let tableHtml = `
          <table class="w-full text-left text-xs text-gray-300 border-collapse">
            <thead>
              <tr class="border-b border-gray-700 text-gray-400">
                <th class="p-2">Tâche</th>
                <th class="p-2">Bareme</th>
                ${weekDates.map(d => `<th class="p-2 text-center ${d === today ? 'text-blue-400 font-bold' : ''}">${new Date(d.split('-')[0], d.split('-')[1]-1, d.split('-')[2]).toLocaleDateString('fr-FR', { weekday: 'short' })}</th>`).join('')}
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-700/50">
        `;

        st.tasks.forEach(task => {
          tableHtml += `
            <tr>
              <td class="p-2 font-medium text-white">${task.title}</td>
              <td class="p-2 text-blue-400 font-bold">+${task.points} pts</td>
          `;
          weekDates.forEach(d => {
            const isDone = !!st.logs[d]?.[task.id]?.completed;
            tableHtml += `
              <td class="p-2 text-center">
                <input type="checkbox" ${isDone ? 'checked' : ''} onchange="onToggleTask('${task.id}', '${d}')" class="rounded border-gray-700 bg-gray-900 text-blue-600">
              </td>
            `;
          });
          tableHtml += `</tr>`;
        });

        tableHtml += `</tbody></table>`;
        weeklyContainer.innerHTML = tableHtml;
      }

      // RENDU DES OBJECTIFS
      const goalsContainer = document.getElementById('goals-list-container');
      goalsContainer.innerHTML = '';

      if (st.goals.length === 0) {
        goalsContainer.innerHTML = `<p class="text-xs text-gray-500 italic">Aucun objectif créé pour le moment.</p>`;
      }

      st.goals.forEach(goal => {
        let contentHtml = '';

        if (goal.type === 'SCALE' && goal.subGoals) {
          contentHtml = goal.subGoals.map(sg => {
            const tasksList = sg.taskIds.map(tid => st.tasks.find(t => t.id === tid)).filter(Boolean);
            
            return `
              <div class="bg-gray-900 p-3.5 rounded-lg border border-gray-700/60 space-y-2">
                <h4 class="text-xs font-bold text-blue-400 flex items-center space-x-1">
                  <span>📌 ${sg.title}</span>
                </h4>
                <div class="space-y-1.5 pl-2">
                  ${tasksList.map(t => renderTaskItemWithEdit(t)).join('')}
                </div>
              </div>
            `;
          }).join('');
        } else if (goal.directTaskIds) {
          const tasksList = goal.directTaskIds.map(tid => st.tasks.find(t => t.id === tid)).filter(Boolean);
          contentHtml = `
            <div class="bg-gray-900 p-3.5 rounded-lg border border-gray-700/60 space-y-2">
              ${tasksList.map(t => renderTaskItemWithEdit(t)).join('')}
            </div>
          `;
        }

        goalsContainer.innerHTML += `
          <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 space-y-3 shadow-md">
            <div class="flex justify-between items-center border-b border-gray-700 pb-2.5">
              <div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-purple-400">${goal.type === 'SCALE' ? '🏆 Objectif Échelle (Jalons)' : '🎯 Objectif Direct'}</span>
                <h3 class="text-sm font-bold text-white mt-0.5">${goal.title}</h3>
              </div>
              <button onclick="onDeleteGoal('${goal.id}')" class="text-xs text-gray-500 hover:text-red-400 transition flex items-center space-x-1">
                <span>🗑️ Supprimer</span>
              </button>
            </div>
            <div class="space-y-3">${contentHtml}</div>
          </div>
        `;
      });
    }

    function renderTaskItemWithEdit(t) {
      const daysBadges = t.days ? t.days.map(d => {
        const dayObj = DAYS_MAP.find(m => m.key === d);
        return dayObj ? `<span class="text-[8px] bg-gray-800 text-gray-400 px-1 rounded">${dayObj.label}</span>` : '';
      }).join('') : '';

      return `
        <div class="flex items-center justify-between text-xs text-gray-200 bg-gray-800/60 p-2 rounded border border-gray-700/40 hover:border-gray-600 transition">
          <div class="flex items-center space-x-2">
            <span class="font-medium">• ${t.title}</span>
            <div class="flex space-x-0.5">${daysBadges}</div>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-[10px] text-blue-400 font-bold bg-blue-950/60 px-1.5 py-0.5 rounded border border-blue-800/60">+${t.points} pts</span>
            <button onclick="openEditTaskModal('${t.id}')" title="Modifier cette tâche" class="text-gray-400 hover:text-yellow-400 text-xs px-1 transition">✏️</button>
          </div>
        </div>
      `;
    }

    async function onToggleTask(taskId, dateStr = getTodayString()) { await toggleTaskLog(taskId, dateStr); renderUI(); }
    async function onDeleteTask(taskId) { await deleteTask(taskId); renderUI(); }
    async function onDeleteGroup(groupId) {
      if (confirm("Supprimer ce groupe et ses tâches ?")) { await deleteGroup(groupId); renderUI(); }
    }
    async function onDeleteGoal(goalId) {
      if (confirm("Supprimer cet objectif ?")) { await deleteGoal(goalId); renderUI(); }
    }

    function openModal(title, html) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function openWeightModal() {
      const st = loadState();
      const rows = st.groups.map(g => `
        <div class="flex items-center justify-between bg-gray-900 p-2.5 rounded border border-gray-700">
          <span class="text-xs text-white font-medium">${g.icon} ${g.name}</span>
          <select onchange="updateGroupWeight('${g.id}', this.value)" class="bg-gray-800 text-white text-xs px-2 py-1 rounded border border-gray-700">
            <option value="1" ${g.weight == 1 ? 'selected' : ''}>×1 (Normal)</option>
            <option value="2" ${g.weight == 2 ? 'selected' : ''}>×2 (Important)</option>
            <option value="3" ${g.weight == 3 ? 'selected' : ''}>×3 (Prioritaire)</option>
          </select>
        </div>
      `).join('');

      openModal("Coefficients des Groupes", `<div class="space-y-3">${rows}</div>`);
    }

    function openCreateGoalModal() {
      tempSubGoals = [{ title: 'Jalon 1', tasks: [{ title: '', points: 20, days: ['MON','TUE','WED','THU','FRI','SAT','SUN'] }] }];
      renderGoalFormModal();
    }

    function renderGoalFormModal() {
      const st = loadState();
      const groupOptions = st.groups.map(g => `<option value="${g.id}">${g.icon} ${g.name}</option>`).join('');
      const type = document.getElementById('m-goal-type')?.value || 'SCALE';

      let structureHtml = '';

      if (type === 'SCALE') {
        structureHtml = tempSubGoals.map((sg, sgIdx) => `
          <div class="bg-gray-900 p-3.5 rounded-xl border border-gray-700 space-y-3">
            <div class="flex items-center justify-between border-b border-gray-800 pb-2">
              <input type="text" value="${sg.title}" onchange="tempSubGoals[${sgIdx}].title = this.value" placeholder="Nom du jalon / étape" class="bg-gray-800 border border-gray-700 rounded px-2.5 py-1 text-xs text-white font-bold w-2/3">
              ${tempSubGoals.length > 1 ? `<button type="button" onclick="removeSubGoal(${sgIdx})" class="text-xs text-red-400 hover:underline">Supprimer jalon</button>` : ''}
            </div>

            <div class="space-y-2">
              ${sg.tasks.map((t, tIdx) => renderTaskFormRow(sgIdx, tIdx, t)).join('')}
            </div>

            <button type="button" onclick="addTaskToSubGoal(${sgIdx})" class="text-xs text-blue-400 hover:text-blue-300 font-semibold flex items-center space-x-1">
              <span>➕ Ajouter une tâche à ce jalon</span>
            </button>
          </div>
        `).join('');

        structureHtml += `
          <button type="button" onclick="addSubGoal()" class="w-full bg-gray-800 hover:bg-gray-750 border border-dashed border-gray-600 text-gray-300 py-2 rounded-lg text-xs font-bold transition">
            ➕ Ajouter un Jalon (Sous-objectif)
          </button>
        `;
      } else {
        const tasks = tempSubGoals[0]?.tasks || [];
        structureHtml = `
          <div class="bg-gray-900 p-3.5 rounded-xl border border-gray-700 space-y-3">
            <h4 class="text-xs font-bold text-gray-300">Liste des tâches de l'objectif</h4>
            <div class="space-y-2">
              ${tasks.map((t, tIdx) => renderTaskFormRow(0, tIdx, t)).join('')}
            </div>
            <button type="button" onclick="addTaskToSubGoal(0)" class="text-xs text-blue-400 hover:text-blue-300 font-semibold flex items-center space-x-1">
              <span>➕ Ajouter une tâche</span>
            </button>
          </div>
        `;
      }

      const modalHtml = `
        <form onsubmit="handleCreateGoalSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Titre de l'Objectif</label>
            <input type="text" id="m-goal-title" required placeholder="Ex: Devenir Analyste Data" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1">Méthode d'objectif</label>
              <select id="m-goal-type" onchange="onGoalTypeChange(this.value)" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white">
                <option value="SCALE" ${type === 'SCALE' ? 'selected' : ''}>🏆 Échelle (avec Jalons)</option>
                <option value="DIRECT" ${type === 'DIRECT' ? 'selected' : ''}>🎯 Direct (Liste de tâches)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1">Groupe associé</label>
              <select id="m-goal-group" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white">${groupOptions}</select>
            </div>
          </div>

          <div class="border-t border-gray-700 pt-3 space-y-3">
            ${structureHtml}
          </div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-xs transition">Enregistrer l'Objectif</button>
        </form>
      `;

      openModal("Créer un Objectif Personnalisé", modalHtml);
    }

    function renderTaskFormRow(sgIdx, tIdx, task) {
      const daysCheckboxes = DAYS_MAP.map(d => `
        <label class="flex flex-col items-center cursor-pointer">
          <input type="checkbox" onchange="updateTaskDayInTemp(${sgIdx}, ${tIdx}, '${d.key}', this.checked)" ${task.days.includes(d.key) ? 'checked' : ''} class="rounded border-gray-700 bg-gray-800 text-blue-600">
          <span class="text-[9px] text-gray-400 mt-0.5">${d.label}</span>
        </label>
      `).join('');

      return `
        <div class="bg-gray-800 p-2.5 rounded-lg border border-gray-700 space-y-2">
          <div class="flex gap-2 items-center">
            <input type="text" value="${task.title}" required onchange="tempSubGoals[${sgIdx}].tasks[${tIdx}].title = this.value" placeholder="Nom de la tâche" class="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-white">
            <select onchange="tempSubGoals[${sgIdx}].tasks[${tIdx}].points = this.value" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-white">
              <option value="10" ${task.points == 10 ? 'selected' : ''}>10 Pts</option>
              <option value="20" ${task.points == 20 ? 'selected' : ''}>20 Pts</option>
              <option value="30" ${task.points == 30 ? 'selected' : ''}>30 Pts</option>
            </select>
            ${tempSubGoals[sgIdx].tasks.length > 1 ? `<button type="button" onclick="removeTaskFromSubGoal(${sgIdx}, ${tIdx})" class="text-gray-400 hover:text-red-400 font-bold text-xs">&times;</button>` : ''}
          </div>
          <div class="flex justify-between bg-gray-900 p-1.5 rounded border border-gray-700/60">
            ${daysCheckboxes}
          </div>
        </div>
      `;
    }

    function onGoalTypeChange(newType) {
      if (newType === 'DIRECT') {
        tempSubGoals = [{ title: 'Direct', tasks: tempSubGoals[0]?.tasks || [{ title: '', points: 20, days: ['MON','TUE','WED','THU','FRI','SAT','SUN'] }] }];
      } else {
        tempSubGoals = [{ title: 'Jalon 1', tasks: tempSubGoals[0]?.tasks || [{ title: '', points: 20, days: ['MON','TUE','WED','THU','FRI','SAT','SUN'] }] }];
      }
      renderGoalFormModal();
    }

    function addSubGoal() {
      tempSubGoals.push({ title: `Jalon ${tempSubGoals.length + 1}`, tasks: [{ title: '', points: 20, days: ['MON','TUE','WED','THU','FRI','SAT','SUN'] }] });
      renderGoalFormModal();
    }

    function removeSubGoal(sgIdx) {
      tempSubGoals.splice(sgIdx, 1);
      renderGoalFormModal();
    }

    function addTaskToSubGoal(sgIdx) {
      tempSubGoals[sgIdx].tasks.push({ title: '', points: 20, days: ['MON','TUE','WED','THU','FRI','SAT','SUN'] });
      renderGoalFormModal();
    }

    function removeTaskFromSubGoal(sgIdx, tIdx) {
      tempSubGoals[sgIdx].tasks.splice(tIdx, 1);
      renderGoalFormModal();
    }

    function updateTaskDayInTemp(sgIdx, tIdx, dayKey, isChecked) {
      const days = tempSubGoals[sgIdx].tasks[tIdx].days;
      if (isChecked && !days.includes(dayKey)) days.push(dayKey);
      else if (!isChecked && days.includes(dayKey)) {
        tempSubGoals[sgIdx].tasks[tIdx].days = days.filter(d => d !== dayKey);
      }
    }

    async function handleCreateGoalSubmit(e) {
      e.preventDefault();
      const title = document.getElementById('m-goal-title').value.trim();
      const type = document.getElementById('m-goal-type').value;
      const groupId = document.getElementById('m-goal-group').value;

      if (!title) return;

      await addComplexGoal(title, type, groupId, tempSubGoals);
      closeModal();
      renderUI();
    }

    function openEditTaskModal(taskId) {
      const st = loadState();
      const task = st.tasks.find(t => t.id === taskId);
      if (!task) return;

      const daysSelectorHtml = DAYS_MAP.map(d => `
        <label class="flex flex-col items-center cursor-pointer">
          <input type="checkbox" value="${d.key}" ${task.days && task.days.includes(d.key) ? 'checked' : ''} class="edit-day-checkbox rounded border-gray-700 bg-gray-900 text-blue-600">
          <span class="text-[10px] text-gray-300 mt-1">${d.label}</span>
        </label>
      `).join('');

      const html = `
        <form onsubmit="handleEditTaskSubmit(event, '${taskId}')" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Titre de la tâche</label>
            <input type="text" id="m-edit-title" value="${task.title}" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Barème de Points</label>
            <select id="m-edit-points" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white">
              <option value="10" ${task.points == 10 ? 'selected' : ''}>⚡ 10 Pts — Facile</option>
              <option value="20" ${task.points == 20 ? 'selected' : ''}>🎯 20 Pts — Moyen</option>
              <option value="30" ${task.points == 30 ? 'selected' : ''}>🔥 30 Pts — Intense</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-2">Jours d'exécution</label>
            <div class="flex justify-between bg-gray-900 p-3 rounded-lg border border-gray-700">
              ${daysSelectorHtml}
            </div>
          </div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-xs transition">Enregistrer les Modifications</button>
        </form>
      `;

      openModal("Modifier la Tâche", html);
    }

    async function handleEditTaskSubmit(e, taskId) {
      e.preventDefault();
      const title = document.getElementById('m-edit-title').value.trim();
      const points = document.getElementById('m-edit-points').value;
      const selectedDays = Array.from(document.querySelectorAll('.edit-day-checkbox:checked')).map(cb => cb.value);

      if (title) {
        await updateTask(taskId, title, points, selectedDays);
        closeModal();
        renderUI();
      }
    }

    function openAddGroupModal() {
      const html = `
        <form onsubmit="handleAddGroupSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Nom du groupe</label>
            <input type="text" id="m-group-name" required placeholder="Ex: Projets Perso" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1">Icône (Emoji)</label>
              <input type="text" id="m-group-icon" value="⚡" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white text-center">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-300 mb-1">Coefficient</label>
              <select id="m-group-weight" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white">
                <option value="1">×1 (Normal)</option>
                <option value="2">×2 (Important)</option>
                <option value="3">×3 (Prioritaire)</option>
              </select>
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-xs transition">Créer le groupe</button>
        </form>
      `;
      openModal("Nouveau Groupe de Tâches", html);
    }

    async function handleAddGroupSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('m-group-name').value.trim();
      const icon = document.getElementById('m-group-icon').value.trim();
      const weight = document.getElementById('m-group-weight').value;
      if (name) { await addGroup(name, icon, weight); closeModal(); renderUI(); }
    }

    function openAddTaskModal(groupId, groupName) {
      const daysSelectorHtml = DAYS_MAP.map(d => `
        <label class="flex flex-col items-center cursor-pointer">
          <input type="checkbox" value="${d.key}" checked class="day-checkbox rounded border-gray-700 bg-gray-900 text-blue-600">
          <span class="text-[10px] text-gray-300 mt-1">${d.label}</span>
        </label>
      `).join('');

      const html = `
        <form onsubmit="handleAddTaskSubmit(event, '${groupId}')" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Titre de la tâche</label>
            <input type="text" id="m-task-title" required placeholder="Ex: Lecture 20 mins" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Barème de Points</label>
            <select id="m-task-points" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white">
              <option value="10">⚡ 10 Pts — Facile</option>
              <option value="20" selected>🎯 20 Pts — Moyen</option>
              <option value="30">🔥 30 Pts — Intense</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-2">Jours d'exécution</label>
            <div class="flex justify-between bg-gray-900 p-3 rounded-lg border border-gray-700">
              ${daysSelectorHtml}
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-xs transition">Créer la tâche</button>
        </form>
      `;
      openModal(`Ajouter une tâche dans ${groupName}`, html);
    }

    async function handleAddTaskSubmit(e, groupId) {
      e.preventDefault();
      const title = document.getElementById('m-task-title').value.trim();
      const points = document.getElementById('m-task-points').value;
      const selectedDays = Array.from(document.querySelectorAll('.day-checkbox:checked')).map(cb => cb.value);

      if (title) {
        await addStandaloneTask(title, points, groupId, selectedDays);
        closeModal();
        renderUI();
      }
    }
  </script>
</body>
</html>
