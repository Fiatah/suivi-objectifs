<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation de Mariage</title>
  <link rel="stylesheet" href="style.css">
  <!-- GSAP pour les animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div class="container">
    <!-- Section Enveloppe -->
    <div id="envelope-wrapper" class="envelope-wrapper">
      <div class="envelope">
        <!-- Sceau d'ouverture -->
        <div id="seal" class="seal">
          <span>Ouvrir</span>
        </div>
      </div>
    </div>

    <!-- Contenu de l'invitation (directement accessible) -->
    <main id="invitation-content" class="invitation-content">
      <header class="header">
        <h1>Invitation au Mariage</h1>
        <p class="subtitle">Nous avons le plaisir de vous accueillir !</p>
      </header>

      <section class="details">
        <h2>Détails de l'événement</h2>
        <p><strong>Date :</strong> À venir</p>
        <p><strong>Lieu :</strong> À préciser</p>
      </section>

      <!-- Formulaire de réponse RSVP -->
      <section class="rsvp-section">
        <h3>Confirmation de présence (RSVP)</h3>
        <form id="rsvp-form">
          <div class="form-group">
            <label for="guest-name">Votre Nom & Prénom :</label>
            <input type="text" id="guest-name" placeholder="Ex: Jean Dupont" required>
          </div>

          <div class="form-group">
            <label for="attendance">Serez-vous présent ?</label>
            <select id="attendance" required>
              <option value="">-- Sélectionnez une option --</option>
              <option value="yes">Oui, avec plaisir</option>
              <option value="no">Désolé(e), je ne pourrai pas</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">Envoyer la réponse</button>
        </form>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
